name: CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18.x'
  MONGODB_VERSION: '6.0'

jobs:
  # ================================
  # Code Quality & Security
  # ================================
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Run ESLint
      working-directory: ./backend
      run: npm run lint
      
    - name: Check code formatting
      working-directory: ./backend
      run: npm run format:check
      
    - name: Security audit
      working-directory: ./backend
      run: npm audit --audit-level high
      
    - name: Run Snyk security scan
      working-directory: ./backend
      run: |
        npm install -g snyk
        snyk auth ${{ secrets.SNYK_TOKEN }}
        snyk test --severity-threshold=high
      continue-on-error: true

  # ================================
  # Backend Testing
  # ================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Create test environment file
      working-directory: ./backend
      run: |
        cp env.example .env
        echo "NODE_ENV=test" >> .env
        echo "MONGODB_URI_TEST=mongodb://localhost:27017/superprompt_test" >> .env
        echo "JWT_SECRET=test-secret-key-for-ci" >> .env
        
    - name: Run unit tests
      working-directory: ./backend
      run: npm run test
      
    - name: Run integration tests
      working-directory: ./backend
      run: npm run test:integration
      
    - name: Generate coverage report
      working-directory: ./backend
      run: npm run test:coverage
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./backend/coverage
        flags: backend
        name: backend-coverage

  # ================================
  # Frontend Testing (Extension)
  # ================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install frontend dependencies
      working-directory: ./extention
      run: |
        if [ -f package.json ]; then
          npm ci
        else
          echo "No package.json found in extension directory"
        fi
        
    - name: Run frontend linting
      working-directory: ./extention
      run: |
        if [ -f package.json ]; then
          npm run lint || echo "Lint script not found"
        fi
        
    - name: Validate extension manifest
      working-directory: ./extention
      run: |
        node -e "
          const manifest = require('./manifest.json');
          if (!manifest.name || !manifest.version) {
            throw new Error('Invalid manifest.json');
          }
          console.log('Manifest validation passed');
        "

  # ================================
  # Build & Package
  # ================================
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [quality, backend-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci --only=production
      
    - name: Build Docker image
      working-directory: ./backend
      run: |
        docker build -t superprompt-api:${{ github.sha }} .
        docker build -t superprompt-api:latest .
        
    - name: Package extension
      working-directory: ./extention
      run: |
        zip -r superprompt-extension-${{ github.sha }}.zip . \
          -x "*.git*" "node_modules/*" "*.log" "*.tmp"
        
    - name: Upload extension artifact
      uses: actions/upload-artifact@v3
      with:
        name: extension-package
        path: extention/superprompt-extension-${{ github.sha }}.zip
        
    - name: Save Docker image
      run: |
        docker save superprompt-api:${{ github.sha }} | gzip > superprompt-api.tar.gz
        
    - name: Upload Docker artifact
      uses: actions/upload-artifact@v3
      with:
        name: docker-image
        path: superprompt-api.tar.gz

  # ================================
  # Security Scanning
  # ================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Docker image
      uses: actions/download-artifact@v3
      with:
        name: docker-image
        
    - name: Load Docker image
      run: |
        docker load < superprompt-api.tar.gz
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'superprompt-api:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # ================================
  # Deployment (Production)
  # ================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install Vercel CLI
      run: npm i -g vercel@latest
      
    - name: Deploy to Vercel
      working-directory: ./backend
      run: |
        vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --confirm
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Run deployment health check
      run: |
        # Wait for deployment to be ready
        sleep 30
        
        # Health check
        curl -f ${{ secrets.PRODUCTION_URL }}/api/health || exit 1
        echo "Production deployment health check passed"
        
    - name: Notify deployment status
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()

  # ================================
  # Deployment (Staging)
  # ================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, build]
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install Vercel CLI
      run: npm i -g vercel@latest
      
    - name: Deploy to Vercel (Preview)
      working-directory: ./backend
      run: |
        vercel --token ${{ secrets.VERCEL_TOKEN }} --confirm
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ================================
  # Performance Testing
  # ================================
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/development'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install k6
      run: |
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
        
    - name: Run performance tests
      run: |
        k6 run --vus 10 --duration 30s backend/tests/performance/api-load-test.js
      env:
        API_BASE_URL: ${{ secrets.STAGING_URL }}

  # ================================
  # Release
  # ================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          CHANGELOG=$(git log --oneline --pretty=format:"- %s (%h)")
        else
          CHANGELOG=$(git log $LAST_TAG..HEAD --oneline --pretty=format:"- %s (%h)")
        fi
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Get version from package.json
      id: version
      working-directory: ./backend
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: extension-package
        
    - name: Create release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        release_name: SuperPrompt v${{ steps.version.outputs.VERSION }}
        body: |
          ## What's Changed
          
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ## Installation
          
          ### Chrome Extension
          1. Download `superprompt-extension-${{ github.sha }}.zip`
          2. Extract the files
          3. Load unpacked extension in Chrome
          
          ### API
          - Production API: ${{ secrets.PRODUCTION_URL }}
          - Documentation: ${{ secrets.PRODUCTION_URL }}/api/docs
        draft: false
        prerelease: false
        
    - name: Upload extension to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: superprompt-extension-${{ github.sha }}.zip
        asset_name: superprompt-extension.zip
        asset_content_type: application/zip