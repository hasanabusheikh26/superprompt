<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperPrompt</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .popup-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .popup-header img {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
        }
        .popup-header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .popup-header p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 14px;
        }
        .popup-content {
            text-align: center;
        }
        .btn-primary {
            width: 100%;
            padding: 12px 24px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background: #1557b0;
        }
        .instructions {
            text-align: left;
            margin: 15px 0;
            font-size: 13px;
            color: #666;
        }
        .instructions ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        .instructions li {
            margin: 5px 0;
        }
        
        .user-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin: 15px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            font-size: 13px;
        }
        
        .user-status span {
            color: #495057;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }
        
        .btn-secondary {
            padding: 6px 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="popup-header">
        <img src="assets/icon.png" alt="SuperPrompt">
        <h1>SuperPrompt</h1>
        <p>AI-powered prompt enhancement</p>
    </div>
    
    <div class="popup-content">
        <div id="user-status" class="user-status">
            <span id="status-text">Loading...</span>
            <button id="auth-btn" class="btn-secondary">Login</button>
        </div>
        
        <div class="instructions">
            <strong>How to use:</strong>
            <ol>
                <li>Select any text on any webpage</li>
                <li>Click the SuperPrompt icon that appears</li>
                <li>Add your instruction or choose a preset</li>
                <li>Click "Superprompt it" to enhance</li>
            </ol>
        </div>
        
        <a href="auth-ui.html" target="_blank" class="btn-primary">
            Open Settings
        </a>
    </div>

    <script>
        // Check user authentication status
        document.addEventListener('DOMContentLoaded', async () => {
            const statusText = document.getElementById('status-text');
            const authBtn = document.getElementById('auth-btn');
            
            try {
                // Check if user is logged in via localStorage
                const token = localStorage.getItem('superprompt_token');
                
                if (token) {
                    // Try to validate token with backend
                    const response = await fetch('https://superprompt-nwhqu7jm8-hass-projects-b72778ab.vercel.app/api/auth/validate', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        statusText.textContent = `Logged in as: ${data.user.email}`;
                        authBtn.textContent = 'Logout';
                        authBtn.onclick = () => {
                            localStorage.removeItem('superprompt_token');
                            statusText.textContent = 'Not logged in';
                            authBtn.textContent = 'Login';
                        };
                    } else {
                        // Invalid token
                        localStorage.removeItem('superprompt_token');
                        statusText.textContent = 'Not logged in';
                        authBtn.textContent = 'Login';
                        authBtn.onclick = () => {
                            window.open('auth-ui.html', '_blank');
                        };
                    }
                } else {
                    statusText.textContent = 'Not logged in';
                    authBtn.textContent = 'Login';
                    authBtn.onclick = () => {
                        window.open('auth-ui.html', '_blank');
                    };
                }
            } catch (error) {
                console.error('Auth check error:', error);
                statusText.textContent = 'Not logged in';
                authBtn.textContent = 'Login';
                authBtn.onclick = () => {
                    window.open('auth-ui.html', '_blank');
                };
            }
        });
    </script>
</body>
</html>
