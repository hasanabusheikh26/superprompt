<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperPrompt</title>
    <style>
        body {
            width: 320px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            background: #ffffff;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .header img {
            width: 32px;
            height: 32px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .instructions {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .instructions h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .instructions ol {
            margin: 0;
            padding-left: 18px;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        
        .instructions li {
            margin: 6px 0;
        }
        
        .status {
            text-align: center;
            padding: 12px;
            background: #e8f5e8;
            border-radius: 6px;
            color: #2e7d2e;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="assets/icon.png" alt="SuperPrompt">
        <h1>SuperPrompt</h1>
    </div>
    
    <div class="instructions">
        <h3>How to use:</h3>
        <ol>
            <li>Highlight any text on any webpage</li>
            <li>Click the SuperPrompt icon that appears</li>
            <li>Edit your enhanced text</li>
            <li>Click "Replace" to update the original text</li>
        </ol>
    </div>
    
    <div class="status">
        Ready to enhance your text!
    </div>
</body>
</html>
